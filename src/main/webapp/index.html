<!DOCTYPE html>
<html>

<head>
	<title>AI Study Assistant</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f3f4f6;
			margin: 0;
		}

		.header {
			background-color: #2563eb;
			color: white;
			text-align: center;
			padding: 20px;
		}

		.container {
			max-width: 700px;
			margin: 30px auto;
			background-color: white;
			padding: 25px;
			border-radius: 10px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
		}

		input[type=text] {
			width: 70%;
			padding: 12px;
			border: 1px solid #ccc;
			border-radius: 6px;
			font-size: 16px;
		}

		button {
			padding: 12px 20px;
			background-color: #2563eb;
			color: white;
			border: none;
			border-radius: 6px;
			font-size: 16px;
			cursor: pointer;
		}

		button:hover {
			background-color: #1d4ed8;
		}

		a {
			color: #2563eb;
			text-decoration: none;
		}
	</style>
</head>

<body>
	<div class="header">
		<h1>AI Study Assistant</h1>
		<p>Ask any technical question and get a simple explanation</p>
	</div>

	<div class="container">
		<form action="ask" method="post">
			<input type="text" name="question" placeholder="e.g. What is Java OOP?" required>
			<button type="submit">Ask AI</button>
		</form>
		<p><a href="ask">View previous questions</a></p>
	</div>
</body>

</html>
